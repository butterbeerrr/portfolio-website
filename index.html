<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio</title>
    <link rel="stylesheet" href="./src/output.css">
</head>
<body class="m-0 p-0 box-border">

    <!-- Header section -->
    <header class="px-[24px] py-[20px] flex justify-between border-b-1 border-[#808080]">

        <!-- Logo -->
        <div class="flex gap-[5px] items-center">
            <img class="h-[24px] items-center" src="./assets/icon/dev.svg" alt="dev icon">
            <h2 class="font-semibold text-white">DevPortofolio</h1>
        </div>
        
        <!-- Nav -->
        <ul class="hidden md:flex items-center gap-[24px] text-white">
            <li><a href="">Home</a></li>
            <li><a href="">About</a></li>
            <li><a href="">Project</a></li>
            <li><a href="">Contact</a></li>
        </ul>

        <button class="hidden md:flex px-[12px] py-[8px] rounded-xl bg-gradient-to-r from-[#3883f6] to-[#8B5CF6] text-white">
            <p>Contact Me</p>
        </button>

        <button class="md:hidden">
            <img class="h-[24px]" src="./assets/icon/burger-bar.svg" alt="">
        </button>

    </header>

    <main>
        <!-- Home section -->
        <section class="mx-[52px] h-screen flex flex-col justify-center gap-5">

            <!-- Text -->
            <div class="flex flex-col gap-5">
                <p class="inline-block px-4 py-2 bg-[#031420] border border-[#0F243A] text-blue-100 rounded-full w-fit">👋 Hi, I'm</p>
                <h1 class="text-5xl font-bold text-white">Ratu Annisa Larassati</h1>
                <h1 class="pb-2 text-5xl font-bold bg-gradient-to-r from-[#3883f6] to-[#8B5CF6] bg-clip-text text-transparent">Software Engineering</h1>
                <p class="text-[rgba(255,255,255,0.7)]">I build scalable, efficient, and user-friendly web applications with modern technologies.</p>
            </div>

            <!-- Button -->
            <div class="py-5 flex gap-4">
                <a href="" class="m-y-[10px] flex px-[12px] py-[8px] rounded-xl bg-gradient-to-r from-[#3883f6] to-[#8B5CF6] text-white">View Project</a>
                <a href="" class="flex px-[12px] py-[8px] border border-[#808080] rounded-xl text-white">Contact Me</a>
            </div>

            <div class="mt-[48px] flex flex-col gap-5">
                <p class="text-[rgba(255,255,255,0.5)] gap-5">TECH STACK</p>
                <ul class="flex flex-row gap-5 overflow-x-auto py-2">
                    <li class="flex-shrink-0"><img class="h-[58px] w-auto" src="./assets/icon/html.svg" alt="html logo"></li>
                    <li class="flex-shrink-0"><img class="h-[58px] w-auto" src="./assets/icon/js.svg" alt="javascript logo"></li>
                    <li class="flex-shrink-0"><img class="h-[58px] w-auto" src="./assets/icon/java.svg" alt="java logo"></li>
                    <li class="flex-shrink-0"><img class="h-[58px] w-auto" src="./assets/icon/c-plus.svg" alt="C++ logo"></li>
                    <li class="flex-shrink-0"><img class="h-[58px] w-auto" src="./assets/icon/c.svg" alt="C logo"></li>
                </ul>
            </div>
    
        </section>

        <!-- About section -->
        <section>

        </section>

        <!-- Project section -->
        <section>

        </section>

        <!-- Contact section -->
        <section>

        </section>

    </main>

    <!-- Footer section -->
    <footer>

    </footer>

</body>
</html>
